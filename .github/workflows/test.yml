name: Validate MambaFlow
on: [push, pull_request]
jobs:
  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest -q
