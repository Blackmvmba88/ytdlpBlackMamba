{% for job in jobs|reverse %}<article class="job"><strong>{{ job.current or job.urls[0] }}</strong><p>{{ job.status.value }} · {{ job.progress|round|int }}%</p><progress value="{{ job.progress }}" max="100"></progress>{% if job.message %}<p>{{ job.message }}</p>{% endif %}{% if job.status.value in ['queued','running'] %}<form method="post" action="/jobs/{{ job.id }}/cancel"><button class="secondary">Cancelar</button></form>{% endif %}</article>{% else %}<p class="muted">No hay descargas en cola.</p>{% endfor %}
