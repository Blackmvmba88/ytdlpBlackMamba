{% for item in items %}<article class="saved-track"><span class="saved-type">{{ 'MP3 / AUDIO' if item.mode == 'audio' else 'VIDEO' }}</span><strong>{{ item.name }}</strong><span class="saved-ready">✓ En tu Mac</span><button type="button" class="secondary" data-play-url="{{ item.url }}" data-play-name="{{ item.name }}" data-play-mode="{{ item.mode }}">{{ 'Escuchar' if item.mode == 'audio' else 'Ver video' }} ▶</button></article>{% else %}<p>Cuando termine una descarga, aparecerá aquí lista para reproducir.</p>{% endfor %}
